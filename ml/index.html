<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Retorno Mercado Livre</title>
<style>
:root { --bg: #f7f8fa; --fg: #1b1f27; --muted: #5a6272; --accent: #2a5bd7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12151b; --fg: #e6e9ef; --muted: #9aa3b4; --accent: #8fb0ff; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #12151b; --fg: #e6e9ef; --muted: #9aa3b4; --accent: #8fb0ff; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
  padding: 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 52ch; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 1.4rem; margin: 0; }
p { margin: 0; color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Voltando para a fábrica…</h1>
  <p>Esta página só repassa o retorno do login do Mercado Livre para o app local da fábrica, no próprio computador (127.0.0.1). Nada é gravado aqui.</p>
  <p id="manual" hidden><a id="link" href="#">Clique aqui se não voltar sozinho</a>. O app da fábrica precisa estar aberto.</p>
</main>
<script>
(function () {
  var destino = "http://127.0.0.1:8761/ml/callback" + window.location.search;
  var link = document.getElementById("link");
  link.href = destino;
  document.getElementById("manual").hidden = false;
  if (window.location.search) { window.location.replace(destino); }
})();
</script>
</body>
</html>
